name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    # Ubuntu's libcapstone-dev (22.04 and 24.04) is still v4 and lacks the
    # RISC-V arch, so the cgo preamble fails to compile. Debian trixie packages
    # capstone 5.0.x with RISC-V, so run the job in that container and install
    # it straight from apt.
    container: debian:trixie
    env:
      CGO_ENABLED: "1"
    steps:
      - name: Install capstone + toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libcapstone-dev pkg-config build-essential git ca-certificates
      - uses: actions/checkout@v4
      # The run: steps below use the container's default HOME (/root), while
      # actions/checkout records its safe.directory under the action's HOME
      # (/github/home). Without this, git inside `go build` sees the workspace
      # as dubiously owned and aborts VCS stamping with "exit status 128".
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
