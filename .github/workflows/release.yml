name: Release
on:
  push:
    tags:
      - 'v*'

# Needed so the built-in GITHUB_TOKEN may create the release and upload assets.
permissions:
  contents: write

env:
  # Capstone is built from source for every target so each artifact embeds a
  # v5 (RISC-V-capable) libcapstone, regardless of what the OS packages.
  CAPSTONE_VERSION: "5.0.3"

jobs:
  # ---------------------------------------------------------------------------
  # Linux (glibc + musl) and Windows, both arches, cross-compiled from one Linux
  # runner. zig cc is the C compiler/linker for cgo and also builds capstone, so
  # no per-arch runners or distro packages are involved.
  # ---------------------------------------------------------------------------
  cross:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64-glibc, goos: linux,   goarch: amd64, zig: x86_64-linux-gnu.2.28,   sysname: Linux,   lib: so,    static: false }
          - { name: linux-arm64-glibc, goos: linux,   goarch: arm64, zig: aarch64-linux-gnu.2.28,  sysname: Linux,   lib: so,    static: false }
          - { name: linux-amd64-musl,  goos: linux,   goarch: amd64, zig: x86_64-linux-musl,       sysname: Linux,   lib: so,    static: true  }
          - { name: linux-arm64-musl,  goos: linux,   goarch: arm64, zig: aarch64-linux-musl,      sysname: Linux,   lib: so,    static: true  }
          - { name: windows-amd64,     goos: windows, goarch: amd64, zig: x86_64-windows-gnu,      sysname: Windows, lib: dll,   static: true  }
          - { name: windows-arm64,     goos: windows, goarch: arm64, zig: aarch64-windows-gnu,     sysname: Windows, lib: dll,   static: true  }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: mlugg/setup-zig@v2
        with:
          version: "0.13.0"

      - name: Build static libcapstone for ${{ matrix.name }}
        run: |
          set -eux
          git clone --depth 1 -b "${CAPSTONE_VERSION}" \
            https://github.com/capstone-engine/capstone.git capstone-src

          # CMake wants single-binary compiler paths, so wrap the zig cross tools.
          mkdir -p wrap
          printf '#!/bin/sh\nexec zig cc -target %s "$@"\n'  "${{ matrix.zig }}" > wrap/cc
          printf '#!/bin/sh\nexec zig c++ -target %s "$@"\n' "${{ matrix.zig }}" > wrap/cxx
          printf '#!/bin/sh\nexec zig ar "$@"\n'             > wrap/ar
          printf '#!/bin/sh\nexec zig ranlib "$@"\n'         > wrap/ranlib
          chmod +x wrap/*

          cmake -S capstone-src -B capstone-src/build \
            -DCMAKE_SYSTEM_NAME="${{ matrix.sysname }}" \
            -DCMAKE_C_COMPILER="$PWD/wrap/cc" \
            -DCMAKE_CXX_COMPILER="$PWD/wrap/cxx" \
            -DCMAKE_AR="$PWD/wrap/ar" \
            -DCMAKE_RANLIB="$PWD/wrap/ranlib" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCAPSTONE_BUILD_SHARED_LIBS=OFF \
            -DCAPSTONE_BUILD_STATIC=ON \
            -DCAPSTONE_BUILD_CSTOOL=OFF \
            -DCAPSTONE_BUILD_TESTS=OFF \
            -DCMAKE_INSTALL_PREFIX="$PWD/capstone-prefix"
          cmake --build capstone-src/build --target install -j"$(nproc)"

          # capstone's CMake build does not emit a pkg-config file, and the cgo
          # preamble uses `#cgo pkg-config: capstone`, so synthesize one from the
          # paths that were actually installed (lib vs lib64 varies).
          prefix="$PWD/capstone-prefix"
          hdr="$(find "$prefix" -name capstone.h -path '*/capstone/*' | head -1)"
          lib="$(find "$prefix" -name 'libcapstone.a' | head -1)"
          test -n "$hdr" || { echo "capstone.h not installed"; find "$prefix"; exit 1; }
          test -n "$lib" || { echo "libcapstone.a not installed"; find "$prefix"; exit 1; }
          incdir="${hdr%/capstone/capstone.h}"
          libdir="$(dirname "$lib")"
          mkdir -p "$prefix/lib/pkgconfig"
          cat > "$prefix/lib/pkgconfig/capstone.pc" <<EOF
          Name: capstone
          Description: Capstone disassembly engine
          Version: ${CAPSTONE_VERSION}
          Cflags: -I$incdir
          Libs: -L$libdir -lcapstone
          EOF
          echo "--- capstone.pc ---"; cat "$prefix/lib/pkgconfig/capstone.pc"
          # Hand the resolved paths to the build step.
          echo "CAP_INCDIR=$incdir"   >> "$GITHUB_ENV"
          echo "CAP_LIBDIR=$libdir"   >> "$GITHUB_ENV"
          echo "CAP_PKGDIR=$prefix/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build rop4 CLI and Python wrapper
        run: |
          set -eux
          export CGO_ENABLED=1
          export GOOS="${{ matrix.goos }}"
          export GOARCH="${{ matrix.goarch }}"
          export CC="$PWD/wrap/cc"
          export CXX="$PWD/wrap/cxx"
          # Restrict pkg-config to the synthesized capstone.pc (ignore any host
          # package), and also pass the include path directly to the compiler so
          # the header is found even if pkg-config misbehaves.
          export PKG_CONFIG_PATH="$CAP_PKGDIR"
          export PKG_CONFIG_LIBDIR="$CAP_PKGDIR"
          export CGO_CFLAGS="-I$CAP_INCDIR"
          pkg-config --cflags --libs capstone

          bin="rop4-${{ matrix.name }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then bin="${bin}.exe"; fi

          ldflags="-s -w"
          if [ "${{ matrix.static }}" = "true" ]; then
            ldflags="$ldflags -linkmode external -extldflags '-static'"
          fi

          # CLI: capstone is static-only in the prefix, so it is always embedded;
          # the musl/windows targets additionally link libc statically.
          go build -trimpath -ldflags "$ldflags" -o "$bin" ./cmd/rop4

          # Python wrapper: a shared object either way, with capstone embedded.
          go build -trimpath -buildmode=c-shared \
            -o "librop4-${{ matrix.name }}.${{ matrix.lib }}" ./pybind

          file "$bin" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            rop4-${{ matrix.name }}*
            librop4-${{ matrix.name }}.${{ matrix.lib }}
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # macOS built natively: Apple does not support statically linking libSystem,
  # so only capstone is embedded (the system libc stays dynamic, as on every
  # mac binary). amd64 uses the Intel runner, arm64 the Apple-silicon runner.
  # ---------------------------------------------------------------------------
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-amd64, runner: macos-13 }
          - { name: macos-arm64, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install capstone
        run: brew install capstone pkgconf

      - name: Build rop4 CLI and Python wrapper
        run: |
          set -eux
          export CGO_ENABLED=1
          cap="$(brew --prefix capstone)"
          export PKG_CONFIG_PATH="$cap/lib/pkgconfig"
          export CGO_CFLAGS="-I$cap/include"
          pkg-config --cflags --libs capstone
          # Force the capstone static archive: with the dylib present the linker
          # would prefer it and the artifact would need Homebrew capstone at
          # runtime. Hiding the dylibs makes -lcapstone resolve to libcapstone.a.
          mkdir -p "$RUNNER_TEMP/caphide"
          mv "$cap"/lib/libcapstone*.dylib "$RUNNER_TEMP/caphide/" || true

          go build -trimpath -ldflags "-s -w" \
            -o "rop4-${{ matrix.name }}" ./cmd/rop4
          go build -trimpath -buildmode=c-shared \
            -o "librop4-${{ matrix.name }}.dylib" ./pybind

          otool -L "rop4-${{ matrix.name }}" || true

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            rop4-${{ matrix.name }}
            librop4-${{ matrix.name }}.dylib
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Gather every produced artifact and publish them as individual release
  # assets (no archives). Runs even if some targets failed, so a release still
  # ships whatever built.
  # ---------------------------------------------------------------------------
  release:
    needs: [cross, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
